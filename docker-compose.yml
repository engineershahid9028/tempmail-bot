
version: '3'
services:
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
      - db
  redis:
    image: redis:7
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: tempmail
